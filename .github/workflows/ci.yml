name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q api auth cache db engine middlewares models repository schedulars schemas scanners services utils yaml_loader main.py

      - name: Run tests
        env:
          JWT_SECRET_KEY: ci-only-secret-that-is-long-enough-0123456789
        run: python -m pytest -q

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on committed keys or env files
        run: |
          set -euo pipefail

          echo "Checking the working tree for key material and env files..."
          if git ls-files | grep -E '\.(pem|key|p12|pfx|ppk)$|(^|/)\.env$|(^|/)\.env\.[^e]'; then
            echo "::error::Key material or an environment file is tracked. Remove it and add it to .gitignore."
            exit 1
          fi

          echo "Checking tracked files for secret-shaped strings..."
          if git grep -nIE 'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}' -- . ':(exclude)package-lock.json' ':(exclude)Readme.md' ':(exclude)SECURITY.md' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::A secret-shaped string is committed. Rotate it and remove it from history."
            exit 1
          fi

          echo "No secrets found."

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml config -q
          echo "Compose file is valid."
